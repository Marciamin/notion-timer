<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1분 스피치 타이머</title>
    <style>
        body {
            background-color: transparent; /* 노션 배경과 어우러지게 설정 */
            color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .timer-card {
            background: #252525;
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            width: 280px;
            border: 1px solid #373737;
        }
        #display {
            font-size: 4.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }
        .btn-group, .plus-group {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-group { grid-template-columns: repeat(3, 1fr); }
        .plus-group { grid-template-columns: repeat(4, 1fr); }
        
        button {
            background: #373737;
            color: #efefef;
            border: none;
            padding: 12px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        button:hover { background: #474747; }
        .cancel-btn {
            background: #3c2b2b;
            color: #ff9b9b;
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="timer-card">
    <div id="display">00:00</div>
    
    <div class="btn-group">
        <button onclick="startTimer(60)">1min</button>
        <button onclick="startTimer(180)">3min</button>
        <button onclick="startTimer(300)">5min</button>
    </div>

    <div class="plus-group">
        <button onclick="addTime(5)">+5s</button>
        <button onclick="addTime(10)">+10s</button>
        <button onclick="addTime(15)">+15s</button>
        <button onclick="addTime(20)">+20s</button>
    </div>

    <button class="cancel-btn" onclick="resetTimer()">Cancel</button>
</div>

<script>
    let timeLeft = 0;
    let timerId = null;
    const display = document.getElementById('display');
    
    function playBeep() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 600);
    }

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer(seconds) {
        clearInterval(timerId);
        timeLeft = seconds;
        updateDisplay();
        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                playBeep();
            }
        }, 1000);
    }

    function addTime(seconds) {
        timeLeft += seconds;
        updateDisplay();
    }

    function resetTimer() {
        clearInterval(timerId);
        timeLeft = 0;
        updateDisplay();
    }
</script>
</body>
</html>
